app = "service-haggle"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  FLY_APP_NAME = "service-haggle"
  FLY_REGION = "sjc"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[processes]
  app = "npx next start -H 0.0.0.0 -p 8080"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
